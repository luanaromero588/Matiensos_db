services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: matiensos_db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Matiensos123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - matiensos_db_data:/var/opt/mssql
      - ./Data/Database:/scripts
      - C:/BackupsSQL:/var/opt/mssql/backup

volumes:
  matiensos_db_data:
    external: true
